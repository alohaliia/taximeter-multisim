<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1600" viewBox="0 0 2400 1600">
  <style>
    .bg{fill:#ffffff}
    .title{font: bold 34px sans-serif; fill:#0a2540}
    .chip{fill:#e9f0fb; stroke:#2b577f; stroke-width:3}
    .pin{fill:#fff; stroke:#333; stroke-width:1}
    .label{font: 18px monospace; fill:#102232}
    .wire{stroke:#0b5; stroke-width:4}
    .net{stroke:#333; stroke-width:2}
    .res{fill:#fff; stroke:#b5651d; stroke-width:2}
    .tr{fill:#ffe9e0; stroke:#b02a1b; stroke-width:2}
    .led{fill:#fff6c8; stroke:#a77; stroke-width:2}
    .note{font:16px sans-serif; fill:#214;}
    .small{font:14px sans-serif; fill:#214}
  </style>

  <rect class="bg" x="0" y="0" width="2400" height="1600"/>
  <text x="60" y="60" class="title">Taxi Meter — High-resolution Schematic (SVG)</text>

  <!-- Arduino UNO block -->
  <g id="arduino" transform="translate(80,120)">
    <rect class="chip" width="640" height="420" rx="18" ry="18"/>
    <text x="18" y="40" class="label">Arduino UNO / ATmega328P</text>

    <!-- Digital pins D2..D13 boxes -->
    <g id="pins-left" transform="translate(10,80)">
      <g transform="translate(0,0)">
        <rect class="pin" x="-6" y="0" width="120" height="32" rx="4"/>
        <text x="6" y="22" class="small">D2 (INT0) — Pulse input</text>
      </g>
      <g transform="translate(0,52)">
        <rect class="pin" x="-6" y="0" width="120" height="32" rx="4"/>
        <text x="6" y="22" class="small">D3 &mdash; SEG_A</text>
      </g>
      <g transform="translate(0,104)">
        <rect class="pin" x="-6" y="0" width="120" height="32" rx="4"/>
        <text x="6" y="22" class="small">D4 &mdash; SEG_B</text>
      </g>
      <g transform="translate(0,156)">
        <rect class="pin" x="-6" y="0" width="120" height="32" rx="4"/>
        <text x="6" y="22" class="small">D5 &mdash; SEG_C</text>
      </g>
      <g transform="translate(0,208)">
        <rect class="pin" x="-6" y="0" width="120" height="32" rx="4"/>
        <text x="6" y="22" class="small">D6 &mdash; SEG_D</text>
      </g>
      <g transform="translate(0,260)">
        <rect class="pin" x="-6" y="0" width="120" height="32" rx="4"/>
        <text x="6" y="22" class="small">D7 &mdash; SEG_E</text>
      </g>
      <g transform="translate(0,312)">
        <rect class="pin" x="-6" y="0" width="120" height="32" rx="4"/>
        <text x="6" y="22" class="small">D8 &mdash; SEG_F</text>
      </g>
    </g>

    <g id="pins-right" transform="translate(500,80)">
      <g transform="translate(0,0)">
        <rect class="pin" x="-6" y="0" width="120" height="32" rx="4"/>
        <text x="6" y="22" class="small">D9 &mdash; SEG_G</text>
      </g>
      <g transform="translate(0,52)">
        <rect class="pin" x="-6" y="0" width="120" height="32" rx="4"/>
        <text x="6" y="22" class="small">D10 &mdash; SEG_DP</text>
      </g>
      <g transform="translate(0,104)">
        <rect class="pin" x="-6" y="0" width="120" height="32" rx="4"/>
        <text x="6" y="22" class="small">D11 &mdash; DIG1 enable</text>
      </g>
      <g transform="translate(0,156)">
        <rect class="pin" x="-6" y="0" width="120" height="32" rx="4"/>
        <text x="6" y="22" class="small">D12 &mdash; DIG2 enable</text>
      </g>
      <g transform="translate(0,208)">
        <rect class="pin" x="-6" y="0" width="120" height="32" rx="4"/>
        <text x="6" y="22" class="small">D13 &mdash; DIG3 enable</text>
      </g>
      <g transform="translate(0,260)">
        <rect class="pin" x="-6" y="0" width="120" height="32" rx="4"/>
        <text x="6" y="22" class="small">A0 &mdash; DIG4 enable</text>
      </g>
    </g>

    <text x="18" y="380" class="small">VCC: +5V — GND pins bottom (not shown)</text>
  </g>

  <!-- Pulse source block -->
  <g id="pulse" transform="translate(820,140)">
    <rect x="0" y="0" width="320" height="120" rx="12" ry="12" fill="#f0f7ee" stroke="#2c6a2c" stroke-width="3"/>
    <text x="16" y="34" class="label">Pulse Generator (simulate wheel/Hall)</text>
    <text x="16" y="66" class="small">PULSE source: 0..5V, freq adjustable</text>
    <line x1="320" y1="60" x2="1000" y2="60" stroke="#333" stroke-width="3"/>
    <text x="1004" y="64" class="small">→ D2 (INT0)</text>
  </g>

  <!-- 4-digit 7-seg display grouping -->
  <g id="display" transform="translate(820,320)">
    <text x="0" y="0" class="label">4-digit 7-segment display (common‑cathode)</text>

    <!-- segments panel -->
    <g id="segments" transform="translate(0,36)">
      <!-- Draw a stylized 7-seg block for illustration -->
      <rect x="0" y="0" width="1160" height="520" rx="8" fill="#fff" stroke="#bbb"/>

      <!-- segment wires to left (from Arduino) -->
      <g transform="translate(20,20)">
        <text x="0" y="0" class="small">Segments (each -> 220Ω -> segment pin on every digit)</text>
        <line x1="40" y1="20" x2="220" y2="20" class="net"/>
        <text x="240" y="26" class="small">SEG_A (D3)</text>

        <line x1="40" y1="60" x2="220" y2="60" class="net"/>
        <text x="240" y="66" class="small">SEG_B (D4)</text>

        <line x1="40" y1="100" x2="220" y2="100" class="net"/>
        <text x="240" y="106" class="small">SEG_C (D5)</text>

        <line x1="40" y1="140" x2="220" y2="140" class="net"/>
        <text x="240" y="146" class="small">SEG_D (D6)</text>

        <line x1="40" y1="180" x2="220" y2="180" class="net"/>
        <text x="240" y="186" class="small">SEG_E (D7)</text>

        <line x1="40" y1="220" x2="220" y2="220" class="net"/>
        <text x="240" y="226" class="small">SEG_F (D8)</text>

        <line x1="40" y1="260" x2="220" y2="260" class="net"/>
        <text x="240" y="266" class="small">SEG_G (D9)</text>

        <line x1="40" y1="300" x2="220" y2="300" class="net"/>
        <text x="240" y="306" class="small">SEG_DP (D10)</text>
      </g>

      <!-- four digits, each with cathode transistor -->
      <g transform="translate(420,40)">
        <!-- DIG1 -->
        <g transform="translate(0,0)">
          <rect x="0" y="0" width="220" height="320" rx="6" fill="#fff7f0" stroke="#cc8b6b"/>
          <text x="12" y="28" class="small">DIGIT 1 (leftmost)</text>
          <text x="12" y="56" class="small">Common-cathode → 2N3904 sink</text>
          <line x1="110" y1="300" x2="110" y2="360" stroke="#333" stroke-width="3"/>
          <text x="118" y="366" class="small">→ DIG1 cathode</text>
        </g>
        <!-- DIG2 -->
        <g transform="translate(240,0)">
          <rect x="0" y="0" width="220" height="320" rx="6" fill="#fff7f0" stroke="#cc8b6b"/>
          <text x="12" y="28" class="small">DIGIT 2</text>
          <text x="12" y="56" class="small">Common-cathode → 2N3904 sink</text>
          <line x1="110" y1="300" x2="110" y2="360" stroke="#333" stroke-width="3"/>
          <text x="118" y="366" class="small">→ DIG2 cathode</text>
        </g>
        <!-- DIG3 -->
        <g transform="translate(480,0)">
          <rect x="0" y="0" width="220" height="320" rx="6" fill="#fff7f0" stroke="#cc8b6b"/>
          <text x="12" y="28" class="small">DIGIT 3</text>
          <text x="12" y="56" class="small">Common-cathode → 2N3904 sink</text>
          <line x1="110" y1="300" x2="110" y2="360" stroke="#333" stroke-width="3"/>
          <text x="118" y="366" class="small">→ DIG3 cathode</text>
        </g>
        <!-- DIG4 -->
        <g transform="translate(720,0)">
          <rect x="0" y="0" width="220" height="320" rx="6" fill="#fff7f0" stroke="#cc8b6b"/>
          <text x="12" y="28" class="small">DIGIT 4 (rightmost)</text>
          <text x="12" y="56" class="small">Common-cathode → 2N3904 sink</text>
          <line x1="110" y1="300" x2="110" y2="360" stroke="#333" stroke-width="3"/>
          <text x="118" y="366" class="small">→ DIG4 cathode</text>
        </g>
      </g>

      <!-- digit enable lines from Arduino D11/D12/D13/A0 -->
      <g transform="translate(420,380)">
        <line x1="20" y1="0" x2="-300" y2="0" stroke="#333" stroke-width="3"/>
        <text x="-296" y="4" class="small">D11 → DIG1 enable (via 4.7k base resistor)</text>
        <line x1="260" y1="0" x2="-300" y2="0" stroke="#333" stroke-width="3"/>
        <text x="-296" y="24" class="small">D12 → DIG2 enable</text>
        <line x1="500" y1="0" x2="-300" y2="0" stroke="#333" stroke-width="3"/>
        <text x="-296" y="44" class="small">D13 → DIG3 enable</text>
        <line x1="740" y1="0" x2="-300" y2="0" stroke="#333" stroke-width="3"/>
        <text x="-296" y="64" class="small">A0  → DIG4 enable</text>
      </g>

      <!-- segments connection to digits (visual) -->
      <g transform="translate(220,120)">
        <text x="0" y="0" class="small">Each segment line goes to every digit through 220Ω resistor</text>
      </g>

    </g>
  </g>

  <!-- NPN transistor detail block -->
  <g transform="translate(140,560)">
    <rect x="0" y="0" width="340" height="180" rx="8" fill="#fff" stroke="#b02a1b"/>
    <text x="12" y="28" class="label">Digit sink transistor (2N3904)</text>
    <text x="12" y="56" class="small">Base: via 4.7k resistor from Arduino digit enable pin</text>
    <text x="12" y="80" class="small">Collector: common-cathode of digit</text>
    <text x="12" y="104" class="small">Emitter: GND</text>
  </g>

  <!-- buttons block -->
  <g transform="translate(140,760)">
    <rect x="0" y="0" width="220" height="220" rx="12" fill="#eef6ff" stroke="#2a5fb0"/>
    <text x="12" y="30" class="label">Buttons (to GND) — use INPUT_PULLUP</text>
    <text x="12" y="60" class="small">MODE  → A2</text>
    <text x="12" y="84" class="small">UP    → A3</text>
    <text x="12" y="108" class="small">DOWN  → A4</text>
    <text x="12" y="132" class="small">START → A5</text>
    <text x="12" y="156" class="small">RESET → A6</text>
  </g>

  <!-- notes and legend -->
  <g transform="translate(80,1020)">
    <text x="0" y="0" class="note">Legend & Notes:</text>
    <text x="0" y="28" class="small">• Segment resistors: 220Ω. Use proper values to limit LED current (~8-15mA per segment).</text>
    <text x="0" y="52" class="small">• Digit enable transistors: NPN (2N3904). Base resistor ~4.7k.</text>
    <text x="0" y="76" class="small">• Pulse input: clean with Schmitt buffer (74HC14) or RC filter if noisy; connect to D2 (INT0).</text>
    <text x="0" y="100" class="small">• Display assumption: common-cathode. If you have common-anode, invert drive logic or use PNP/high-side drivers.</text>
    <text x="0" y="124" class="small">• For Multisim: import SPICE netlist or use VSM to load Arduino .hex (see repo README for details).</text>
  </g>

  <text x="60" y="1520" class="small">Generated by Copilot — high-resolution SVG schematic. If you want a PNG, download this SVG and convert with Inkscape (inkscape schematic_highres.svg --export-type=png --export-width=2400).</text>
</svg>
